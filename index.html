<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="images.jpg" type="image/x-icon">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: "Imperial Script", cursive;
            font-weight: 400;
            font-size: large;
            background: linear-gradient(180deg, black,rgb(234, 17, 53),pink);
            -webkit-font-smoothing: antialiased;
        }

        h1, p {
            text-align: center;
            margin: 0 0 8px;
            font-size: 28px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .stage {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            box-sizing: border-box;
            pointer-events: auto;
            overflow: visible;
            touch-action: pan-y;
        }

        .content {
            max-width: 800px;
            width: 100%;
            text-align: center;
            pointer-events: auto;
            max-height: calc(100vh - 220px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 8px;
        }

        .message {
            background: transparent; 
            color: white;
            padding: 0; 
            border-radius: 0;
            box-shadow: none;
            font-size: clamp(18px, 4.5vw, 28px);
            line-height: 1.5;
            text-align: center;
            max-width: 100%;
            margin: 12px auto 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 32px;
        }

        .final-btn {
        display: block;
        margin: 40px auto 20px;
        padding: 12px 20px;
        background: linear-gradient(135deg,pink, rgb(234, 17, 53));
        color: white;
        border: none;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(197, 90, 90, 0.251);
        font-size: 18px;
        cursor: pointer;
        transition: transform 200ms ease, left 200ms ease, top 200ms ease;
       
    }

        .buttons {
            position: relative; 
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            height: 220px;
            width: 100%;
            max-width: 600px;
            padding: 8px;
            box-sizing: border-box;
            pointer-events: auto;
            overflow: visible; 
        }

        button {
            padding: 12px 22px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: transform 200ms ease, left 200ms ease, top 200ms ease;
            background: linear-gradient(135deg,pink, rgb(234, 17, 53));
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(197, 90, 90, 0.251);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            min-width: 110px; 
            height: auto;
        }

        #noBtn { position: relative; }
        #simBtn {
            position: relative;
            transform-origin: center center;
            max-width: 60%;
            min-width: 110px; 
            font-size: clamp(14px, 3.5vw, 18px);
            white-space: normal;      
            overflow-wrap: break-word;
            word-break: break-word;
            text-align: center;
            display: inline-block;
            transition: transform 160ms ease; 
        }

        #noBtn, #simBtn { flex: 0 0 auto; }

        .content::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .content::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }
        .content::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff7aa2 0%, #e91135 100%);
            border-radius: 10px;
            border: 2px solid rgba(0,0,0,0.08);
            min-height: 24px;
        }
        .content::-webkit-scrollbar-thumb:hover {
            filter: brightness(1.05);
        }
        .content::-webkit-scrollbar-corner {
            background: transparent;
        }

        .content.scrollable::after {
            content: '';
            position: absolute;
            right: 12px;
            bottom: 8px;
            width: 6px;
            height: 6px;
            background: linear-gradient(180deg, #ff7aa2 0%, #e91135 100%);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(233,17,53,0.25);
            pointer-events: none;
            opacity: 0.9;
        }

        @media (max-width: 480px) {
            h1, p { font-size: 30px; }
            .buttons { height: auto; gap: 12px; padding: 12px; }
            button { padding: 14px 20px; font-size: 18px; border-radius: 12px; min-width: 120px; }
            #simBtn { max-width: 80%; }
            .message { font-size: clamp(20px, 6.5vw, 36px); }
            .content {
             max-height: calc(100vh - 180px); }
        }

    </style>
</head>
<body>
    <div class="stage">
        <div class="content">
            <h1>Feliz Primeiro Dia de Namoro kkkkk</h1>
            <p>
                espero que eu tenha conseguido te fazer se sentir especial até aqui<br>
                eu te amo muito e quero passar o resto dos meus dias com você<br>
                tenho uma pergunta para ti:<br>

            </p>
        </div>

        <div class="buttons" aria-hidden="false">
            <button id="simBtn" onclick="handleSimClick()" data-scale="1">Sim</button>
            <button id="noBtn" onclick="evadeAndGrow(event)">Não</button>
        </div>
    </div>

    <script>
        const simTexts = ['Tem certeza?', 'Claro né?', 'Pleaseeeee', 'Vai ser tão legal!', 'Eu prometo ser o melhor namorado!', 'Vamos viver muitas aventuras juntos!', 'Eu te amo muito!', 'Não me faça chorar, por favor!', 'Eu já te amo, só falta você aceitar!', 'Vai ser incrível, confia em mim!', 'Eu já comprei a aliança, só falta você aceitar!', 'Vamos ser o casal mais fofo do mundo!','Não me deixe sozinho, por favor!', 'Vamos fazer memórias incríveis juntos!'];

        function rectsOverlap(a, b) {
            return !(a.right <= b.left || a.left >= b.right || a.bottom <= b.top || a.top >= b.bottom);
        }

        function changeSimText() {
            const simBtn = document.getElementById('simBtn');
            const current = simBtn.textContent.trim();
            let next = current;
            let attempts = 0;
            while (next === current && attempts < 10) {
                next = simTexts[Math.floor(Math.random() * simTexts.length)];
                attempts++;
            }
            simBtn.textContent = next;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function handleSimClick() {
            const text = 
`aeeeee, eu sabia que você ia aceitar. Eu te amo muito, agora eu posso oficialmente te chamar de minha namorada? 💙

Nem acredito que agora eu posso chamar a minha princesa de minha namorada, a gente finalmente está namorando, obrigado por me fazer a pessoa mais sortuda do mundo, eu prometo te fazer muito feliz e cuidar de você sempre, em troca você só precisa me prometer que os olhinhos pelos quais eu me apaixonei vão continuar brilhando para mim todos os dias e, que vão continuar sendo só meus 🙄🙄.

Você é minha pessoa favorita e sempre vai ser, eu amo cada mini detalhe seu (até aqueles que você mesma não gosta), eu amo seu sorriso, eu amo aquele seu jeitinho, eu amo quando você me abraça do nada, eu amo quando você me chama de meu amor, eu amo quando você me chama de meu namorado, eu amo quando você me chama de meu bebê, eu amo aquele seu olhar que é só meu, eu amo a sua voz, eu amo cada beijinho que você me dá, eu amo quando você me chama de neném, mas esse ultimo ce não conta pra ninguem 🙄🙄🙄🙄, eu amo aquela sua risada ( você parece uma criancinha, é muito fofoooooooooo ), eu amo que você não sabe reagir aos meus elogios kkkkkkk, você fica vermelinha meu Deus kkkkkk. 

Poderia ficar aqui para sempre falando coisas e mais coisas, mas eu prefiro ir te contando aleatoriamente pelas semanas e ir te mostrando o quanto eu te amo, porque eu sei que você gosta de ouvir isso, e eu gosto de falar, então é perfeito.

eu te amo mil milhões minha princesinha, e eu espero que a minha garotinha continue me amando cada dia mais, nosso relacionamento é e sempre será a minha flor de lótus espelhada (e dessa vez você não é nerd o suficiente pra entender kkkkk, se tu entender você realmente prestou atenção no que eu te falei).`;

            const content = document.querySelector('.content');

           content.innerHTML = `<div class="message">${escapeHtml(text).replace(/\n/g, '<br>')}</div>`;

            content.scrollTop = 0;

            requestAnimationFrame(() => {
                content.scrollTop = 0;
            });

            window.scrollTo(0, 0);

            const buttons = document.querySelector('.buttons');
            if (buttons && buttons.parentElement) buttons.parentElement.removeChild(buttons);

            const noBtn = document.getElementById('noBtn');
            if (noBtn && noBtn.parentElement) noBtn.parentElement.removeChild(noBtn);
            const simBtn = document.getElementById('simBtn');
            if (simBtn && simBtn.parentElement) simBtn.parentElement.removeChild(simBtn);

            const finalBtn = document.createElement('button');
            finalBtn.id = 'finalBtn';
            finalBtn.className = 'final-btn';
            finalBtn.textContent = 'Minha reação :D';

            finalBtn.addEventListener('click', () => {
                window.open('https://youtu.be/8Go6dHuylyM', '_blank');
            });

           finalBtn.style.display = 'none';

            content.appendChild(finalBtn);

            requestAnimationFrame(() => {
            content.scrollTop = 0;
            });

            function checkScrollEnd() {
                const distanceFromBottom =
                    content.scrollHeight -
                    content.clientHeight -
                    content.scrollTop;

                if (distanceFromBottom <= 5) {
                    finalBtn.style.display = 'block';
                    content.removeEventListener('scroll', checkScrollEnd);
                }
            }

            content.addEventListener('scroll', checkScrollEnd);

            checkScrollEnd();

        content.addEventListener('scroll', checkScrollEnd);
        }

        function computeLimits(noWidth, noHeight, padding, extraSide, stage) {
        
            const minVisible = Math.max(40, Math.round(window.innerWidth * 0.12));
            const minLeft = Math.max(-extraSide, -noWidth + minVisible);
            const maxLeftCalc = Math.max(minLeft, stage.clientWidth - minVisible);
            const maxLeft = Math.min(maxLeftCalc, stage.clientWidth - minVisible);
            const minTop = Math.max(8, 0); 
            const maxTop = Math.max(minTop, stage.clientHeight - noHeight - 8); 
            return { minLeft, maxLeft, minTop, maxTop };
        }

        function clampCurrentPos(noBtn, limits) {
            const curLeft = parseFloat(noBtn.style.left) || 0;
            const curTop = parseFloat(noBtn.style.top) || 0;
            let left = Math.min(limits.maxLeft, Math.max(limits.minLeft, curLeft));
            let top = Math.min(limits.maxTop, Math.max(limits.minTop, curTop));
            noBtn.style.left = left + 'px';
            noBtn.style.top = top + 'px';
        }

        function evadeAndGrow(event) {
            if (event && event.cancelable) event.preventDefault();

            const noBtn = document.getElementById('noBtn');
            const simBtn = document.getElementById('simBtn');
            const container = document.querySelector('.buttons');
            const stage = document.querySelector('.stage');

            const extraSide = Math.max(80, Math.round(window.innerWidth * 0.25));

            if (!noBtn) return;

            if (getComputedStyle(noBtn).position !== 'absolute') {
                const stageRect = stage.getBoundingClientRect();
                const btnRect = noBtn.getBoundingClientRect();
                if (noBtn.parentElement !== stage) stage.appendChild(noBtn);
                noBtn.style.position = 'absolute';
                let initLeft = Math.round(btnRect.left - stageRect.left);
                let initTop = Math.round(btnRect.top - stageRect.top);
                if (!isFinite(initLeft)) initLeft = Math.round((stage.clientWidth - noBtn.offsetWidth) / 2);
                if (!isFinite(initTop)) initTop = Math.round((stage.clientHeight - noBtn.offsetHeight) / 2);
                noBtn.style.left = initLeft + 'px';
                noBtn.style.top = initTop + 'px';
                noBtn.style.zIndex = 999;
            }

            if (simBtn) {
                let scale = parseFloat(simBtn.dataset.scale) || 1;
                scale = Math.min(scale + 0.06, 1.12); 
                simBtn.dataset.scale = scale;
                simBtn.style.transform = `scale(${scale})`;
                changeSimText();
            }

            const padding = 8;
            const noWidth = noBtn.offsetWidth;
            const noHeight = noBtn.offsetHeight;

            const limits = computeLimits(noWidth, noHeight, padding, extraSide, stage);

            const stageRect = stage.getBoundingClientRect();
            const simRectAbs = simBtn ? simBtn.getBoundingClientRect() : { left: stageRect.left + stage.clientWidth/2, top: stageRect.top + stage.clientHeight/2, right: stageRect.left + stage.clientWidth/2, bottom: stageRect.top + stage.clientHeight/2, width:0, height:0 };
            const simRect = {
                left: simRectAbs.left - stageRect.left,
                top: simRectAbs.top - stageRect.top,
                right: simRectAbs.right - stageRect.left,
                bottom: simRectAbs.bottom - stageRect.top,
                width: simRectAbs.width,
                height: simRectAbs.height
            };

            let left, top;
            let attempts = 0;
            const maxAttempts = 200;
            while (attempts < maxAttempts) {
                left = Math.floor(Math.random() * (limits.maxLeft - limits.minLeft + 1)) + limits.minLeft;
                top = Math.floor(Math.random() * (limits.maxTop - limits.minTop + 1)) + limits.minTop;

                const candidate = { left, top, right: left + noWidth, bottom: top + noHeight };
                if (!rectsOverlap(candidate, simRect)) break;
                attempts++;
            }

            if (attempts >= maxAttempts) {
                const tryPositions = [
                    { left: Math.max(limits.minLeft, simRect.left - noWidth - padding), top: Math.max(limits.minTop, simRect.top) },
                    { left: Math.min(limits.maxLeft, simRect.right + padding), top: Math.max(limits.minTop, simRect.top) }, 
                    { left: Math.max(limits.minLeft, simRect.left), top: Math.max(limits.minTop, simRect.top - noHeight - padding) }, 
                    { left: Math.max(limits.minLeft, simRect.left), top: Math.min(limits.maxTop, simRect.bottom + padding) } 
                ];
                let placed = false;
                for (const pos of tryPositions) {
                    const cand = { left: pos.left, top: pos.top, right: pos.left + noWidth, bottom: pos.top + noHeight };
                    if (!rectsOverlap(cand, simRect)) {
                        left = pos.left;
                        top = pos.top;
                        placed = true;
                        break;
                    }
                }
                if (!placed) {
                    left = limits.minLeft;
                    top = limits.minTop;
                }
            }
            left = Math.min(limits.maxLeft, Math.max(limits.minLeft, left));
            top = Math.min(limits.maxTop, Math.max(limits.minTop, top));

            noBtn.style.left = left + 'px';
            noBtn.style.top = top + 'px';
        }

        const noBtnEl = document.getElementById('noBtn');
        if (noBtnEl) {
            let pointerInfo = null;

            const onPointerDown = (e) => {
                if (e.cancelable) e.preventDefault();
                pointerInfo = { id: e.pointerId, startX: e.clientX, startY: e.clientY, moved: false };
                try { noBtnEl.setPointerCapture(e.pointerId); } catch (err) { }
            };

            const onPointerMove = (e) => {
                if (!pointerInfo || e.pointerId !== pointerInfo.id) return;
                const dx = e.clientX - pointerInfo.startX;
                const dy = e.clientY - pointerInfo.startY;
                if (Math.hypot(dx, dy) > 10) pointerInfo.moved = true;
            };

            const onPointerUp = (e) => {
                if (!pointerInfo || e.pointerId !== pointerInfo.id) { pointerInfo = null; return; }
                try { noBtnEl.releasePointerCapture(e.pointerId); } catch (err) {  }
                if (!pointerInfo.moved) {
                    if (e.cancelable) e.preventDefault();
                    evadeAndGrow(e);
                }
                pointerInfo = null;
            };

      
            noBtnEl.addEventListener('pointerdown', onPointerDown, { passive: false });
            noBtnEl.addEventListener('pointermove', onPointerMove, { passive: false });
            noBtnEl.addEventListener('pointerup', onPointerUp, { passive: false });

            noBtnEl.addEventListener('pointercancel', () => { pointerInfo = null; });
        }

        const simBtnEl = document.getElementById('simBtn');
        if (simBtnEl) simBtnEl.addEventListener('touchstart', (e) => { e.stopPropagation(); });

        function syncButtonWidths() {
            const sim = document.getElementById('simBtn');
            const no = document.getElementById('noBtn');
            if (!sim || !no) return;

            sim.style.width = '';
            no.style.width = '';

            const simW = Math.ceil(sim.getBoundingClientRect().width);
            const noW = Math.ceil(no.getBoundingClientRect().width);
            sim.style.width = target + 'px';
            no.style.width = target + 'px';
        }

        window.addEventListener('load', syncButtonWidths);
        window.addEventListener('resize', () => {
            clearTimeout(window.__syncBtnTimeout);
            window.__syncBtnTimeout = setTimeout(syncButtonWidths, 120);
            const noBtn = document.getElementById('noBtn');
            if (!noBtn) return;
            const stage = document.querySelector('.stage');
            const padding = 8;
            const extraSide = Math.max(80, Math.round(window.innerWidth * 0.25));
            const noWidth = noBtn.offsetWidth;
            const noHeight = noBtn.offsetHeight;
            const limits = computeLimits(noWidth, noHeight, padding, extraSide, stage);
            clampCurrentPos(noBtn, limits);
        });

        const origEvade = evadeAndGrow;
        function wrappedEvade(e) {
            origEvade(e);
            requestAnimationFrame(() => requestAnimationFrame(syncButtonWidths));
        }
        (function replaceNoBtnPointerUp() {
            const noBtnEl = document.getElementById('noBtn');
            if (!noBtnEl) return;
            noBtnEl.removeEventListener('pointerup', onPointerUp, { passive: false });
            noBtnEl.addEventListener('pointerup', (e) => {
                if (e.cancelable) e.preventDefault();
                wrappedEvade(e);
            }, { passive: false });
        })();

        setTimeout(syncButtonWidths, 300);
    </script>
</body>
</html>
