<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Imperial+Script&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="images.jpg" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
             font-family: "Imperial Script", cursive;
             font-weight: 400;
             font-size: large;
            background: linear-gradient(180deg, black,rgb(234, 17, 53),pink);
            overflow: hidden;
            box-sizing: border-box;
        }

        h1, p {
            text-align: center;
            margin: 0 0 12px;
            font-size: 35px;
            color: white;
             text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .buttons {
            position: relative; 
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            height: 200px;
            width: 100%;
            max-width: 600px;
        }

        button {
            padding: 10px 18px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: transform 200ms ease, left 200ms ease, top 200ms ease;
                background: linear-gradient(135deg,pink, rgb(234, 17, 53));
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(197, 90, 90, 0.251);
        }

        #noBtn {
            position: relative;
        }

        #simBtn {
            position: relative;
            transform-origin: center center;
            max-width: 260px;        
            white-space: normal;      
            overflow-wrap: break-word;
            word-break: break-word;
            text-align: center;
            display: inline-block;
        }

        #noBtn, #simBtn { flex: 0 0 auto; }
    </style>
</head>
<body>
    <h1>Feliz Primeiro Dia de Namoro kkkkk</h1>
    <p>
        espero que eu tenha conseguido te fazer se sentir especial até aqui <br>
        eu te amo muito e quero passar o resto dos meus dias com você <br>
        tenho uma pergunta para ti: <br>
        você quer ser minha Namorada? <br>
    </p>

    <div class="buttons">
        <button id="simBtn" onclick="handleSimClick()" data-scale="1">Sim</button>
        <button id="noBtn" onclick="evadeAndGrow(event)">Não</button>
    </div>

    <script>
        const simTexts = ['Tem certeza?', 'Claro né?', 'Pleaseeeee', 'Vai ser tão legal!', 'Eu prometo ser o melhor namorado!', 'Vamos viver muitas aventuras juntos!', 'Eu te amo muito!', 'Não me faça chorar, por favor!', 'Eu já te amo, só falta você aceitar!', 'Vai ser incrível, confia em mim!', 'Eu já comprei a aliança, só falta você aceitar!', 'Vamos ser o casal mais fofo do mundo!','Não me deixe sozinho, por favor!', 'Vamos fazer memórias incríveis juntos!'];

        function rectsOverlap(a, b) {
            return !(a.right <= b.left || a.left >= b.right || a.bottom <= b.top || a.top >= b.bottom);
        }

        function changeSimText() {
            const simBtn = document.getElementById('simBtn');
            const current = simBtn.textContent.trim();
            let next = current;
            let attempts = 0;
            while (next === current && attempts < 10) {
                next = simTexts[Math.floor(Math.random() * simTexts.length)];
                attempts++;
            }
            simBtn.textContent = next;
        }

        function handleSimClick() {
            const simBtn = document.getElementById('simBtn');
            
            const videoUrl = 'https://youtu.be/8Go6dHuylyM';

             window.open(videoUrl, '_blank');
        }

        function evadeAndGrow(event) {
            const noBtn = document.getElementById('noBtn');
            const simBtn = document.getElementById('simBtn');
            const container = document.querySelector('.buttons');

            const extraSide = 80;

            if (getComputedStyle(noBtn).position !== 'absolute') {
                noBtn.style.position = 'absolute';
                const initLeft = Math.max(-extraSide, (container.clientWidth - noBtn.offsetWidth) / 2 + 70);
                const initTop = Math.max(0, (container.clientHeight - noBtn.offsetHeight) / 2);
                noBtn.style.left = initLeft + 'px';
                noBtn.style.top = initTop + 'px';
            }

            let scale = parseFloat(simBtn.dataset.scale) || 1;
            scale = Math.min(scale + 0.1, 2);
            simBtn.dataset.scale = scale;
            simBtn.style.transform = `scale(${scale})`;
            changeSimText();

            const padding = 8;
            const noWidth = noBtn.offsetWidth;
            const noHeight = noBtn.offsetHeight;

            const minLeft = -extraSide;
            const maxLeft = Math.max(minLeft, container.clientWidth - noWidth - padding + extraSide);
            const maxTop = Math.max(0, container.clientHeight - noHeight - padding);

            const containerRect = container.getBoundingClientRect();
            const simRectAbs = simBtn.getBoundingClientRect();
            const simRect = {
                left: simRectAbs.left - containerRect.left,
                top: simRectAbs.top - containerRect.top,
                right: simRectAbs.right - containerRect.left,
                bottom: simRectAbs.bottom - containerRect.top,
                width: simRectAbs.width,
                height: simRectAbs.height
            };

            let left, top;
            let attempts = 0;
            const maxAttempts = 150;
            while (attempts < maxAttempts) {
                left = Math.floor(Math.random() * (maxLeft - minLeft + 1)) + minLeft;
                top = Math.floor(Math.random() * (maxTop - padding + 1)) + padding;

                const candidate = { left, top, right: left + noWidth, bottom: top + noHeight };
                if (!rectsOverlap(candidate, simRect)) break;
                attempts++;
            }

            if (attempts >= maxAttempts) {
               
                const tryPositions = [
                    { left: Math.max(minLeft, simRect.left - noWidth - padding), top: Math.max(padding, simRect.top) },
                    { left: Math.min(maxLeft, simRect.right + padding), top: Math.max(padding, simRect.top) }, 
                    { left: Math.max(minLeft, simRect.left), top: Math.max(padding, simRect.top - noHeight - padding) }, 
                    { left: Math.max(minLeft, simRect.left), top: Math.min(maxTop, simRect.bottom + padding) } 
                ];
                let placed = false;
                for (const pos of tryPositions) {
                    const cand = { left: pos.left, top: pos.top, right: pos.left + noWidth, bottom: pos.top + noHeight };
                    if (!rectsOverlap(cand, simRect)) {
                        left = pos.left;
                        top = pos.top;
                        placed = true;
                        break;
                    }
                }
                if (!placed) {
                    left = minLeft;
                    top = padding;
                }
            }

            noBtn.style.left = left + 'px';
            noBtn.style.top = top + 'px';
        }

        document.getElementById('noBtn').addEventListener('mouseover', () => {
            evadeAndGrow();
        });
    </script>
</body>
</html>
